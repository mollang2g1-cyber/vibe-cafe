<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일시트 연결 (디자인은 추후 작성) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- [페이지 상단] 카페 헤더 영역 -->
  <header>
    <!-- 카페 로고: 큰 커피 이모지 -->
    <div class="cafe-logo" style="font-size: 3rem;">☕</div>
    <!-- 카페 이름 -->
    <h1>바이브 카페</h1>
    <!-- 부제 -->
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- [탭 메뉴] 주문하기 / 주문 내역 전환 네비게이션 -->
  <nav class="tab-nav">
    <button type="button" class="tab-btn active" id="tabOrderBtn">☕ 주문하기</button>
    <button type="button" class="tab-btn" id="tabHistoryBtn">
      📋 주문 내역 <span id="orderBadge" class="order-badge">0</span>
    </button>
  </nav>

  <!-- 1. [주문하기 탭] 기존 주문서 및 확인 메시지 컨테이너 -->
  <div id="orderTabContent" class="tab-content">

  <!-- [주문서 폼] novalidate: 브라우저 기본 유효성 검사를 비활성화하고 JavaScript로 유효성 검사 수행 -->
  <form id="orderForm" novalidate>

    <!-- 1. 이름 입력 (필수) -->
    <div class="form-group">
      <label for="customerName">이름 (필수)</label>
      <input type="text" id="customerName" name="customerName">
    </div>

    <!-- 2. 전화번호 입력 -->
    <div class="form-group">
      <label for="customerPhone">전화번호</label>
      <input type="tel" id="customerPhone" name="customerPhone" placeholder="010-0000-0000">
    </div>

    <!-- 3. 음료 선택 (드롭다운) -->
    <div class="form-group">
      <label for="beverageSelect">음료 선택</label>
      <select id="beverageSelect" name="beverage">
        <option value="" data-price="0">-- 음료를 선택하세요 --</option>
        <option value="americano" data-price="3500">아메리카노 (3,500원)</option>
        <option value="latte" data-price="4000">카페라떼 (4,000원)</option>
        <option value="mocha" data-price="4500">카페모카 (4,500원)</option>
        <option value="vanilla-latte" data-price="4500">바닐라라떼 (4,500원)</option>
        <option value="green-tea-latte" data-price="4500">녹차라떼 (4,500원)</option>
        <option value="iced-tea" data-price="4000">아이스티 (4,000원)</option>
        <option value="iced-choco" data-price="4500">아이스 초코 (4,500원)</option>
      </select>
    </div>

    <!-- 4. 사이즈 선택 (라디오 버튼) -->
    <fieldset class="form-group">
      <legend>사이즈</legend>
      <div>
        <input type="radio" id="sizeS" name="size" value="S" data-price="0">
        <label for="sizeS">S (+0원)</label>
      </div>
      <div>
        <!-- 기본 선택: M 사이즈 -->
        <input type="radio" id="sizeM" name="size" value="M" data-price="500" checked>
        <label for="sizeM">M (+500원)</label>
      </div>
      <div>
        <input type="radio" id="sizeL" name="size" value="L" data-price="1000">
        <label for="sizeL">L (+1,000원)</label>
      </div>
    </fieldset>

    <!-- 5. 추가 옵션 (체크박스) -->
    <fieldset class="form-group">
      <legend>추가 옵션</legend>
      <div>
        <input type="checkbox" id="optShot" name="option" value="shot" data-price="500">
        <label for="optShot">샷 추가 (+500원)</label>
      </div>
      <div>
        <input type="checkbox" id="optCream" name="option" value="cream" data-price="500">
        <label for="optCream">크림 추가 (+500원)</label>
      </div>
      <div>
        <input type="checkbox" id="optSyrup" name="option" value="syrup" data-price="300">
        <label for="optSyrup">시럽 추가 (+300원)</label>
      </div>
      <div>
        <input type="checkbox" id="optDecaf" name="option" value="decaf" data-price="0">
        <label for="optDecaf">디카페인 (+0원)</label>
      </div>
      <div>
        <input type="checkbox" id="optLight" name="option" value="light" data-price="0">
        <label for="optLight">연하게 (+0원)</label>
      </div>
      <div>
        <input type="checkbox" id="optLessSweet" name="option" value="lessSweet" data-price="0">
        <label for="optLessSweet">덜 달게 (+0원)</label>
      </div>
    </fieldset>

    <!-- 6. 수량 선택 (number, 최소 1, 최대 10, 기본값 1) -->
    <div class="form-group">
      <label for="quantity">수량</label>
      <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
    </div>

    <!-- 7. 요청사항 입력 (textarea) -->
    <div class="form-group">
      <label for="requests">요청사항</label>
      <textarea id="requests" name="requests" rows="4" placeholder="요청사항이 있으시면 적어주세요."></textarea>
    </div>

    <!-- 8. 예상 금액 표시 영역 (주문하기 버튼 바로 위) -->
    <div id="estimatedPriceArea" class="price-area">
      <p>예상 금액: <span id="totalPrice">0</span>원</p>
    </div>

    <!-- 9. 주문하기 버튼 & 10. 다시 작성 버튼 -->
    <div class="button-group">
      <button type="submit" id="submitBtn">주문하기</button>
      <button type="reset" id="resetBtn">다시 작성</button>
    </div>

  </form>

  <!-- 11. 주문 확인 메시지 표시 영역 (처음에는 숨김) -->
  <div id="orderConfirmation" class="confirmation-area" hidden style="display: none;">
    <!-- 주문 완료 시 JavaScript로 확인 메시지가 출력될 영역 -->
  </div>

  </div> <!-- 1. orderTabContent 닫기 -->

  <!-- 2. [주문 내역 탭] 주문 내역 목록 컨테이너 (초기 상태: hidden 숨김) -->
  <div id="historyTabContent" class="tab-content hidden">
    <!-- 동적으로 생성되는 주문 카드 목록 컨테이너 -->
    <div id="orderList" class="order-list"></div>

    <!-- 하단 통계(총 주문 금액 및 건수, 음료별 판매 요약)와 모두 지우기 버튼 영역 -->
    <div id="historySummary" class="history-summary hidden">
      <p id="totalHistoryText" class="total-history-text"></p>
      <!-- 음료별 판매 잔수 요약 (예: "카페라떼 3잔, 아메리카노 1잔") -->
      <p id="beverageSummaryText" class="beverage-summary-text"></p>
      <button type="button" id="clearAllBtn" class="clear-all-btn">내역 모두 지우기</button>
    </div>
  </div>

  <!-- 1. Supabase JS v2 CDN 라이브러리 (script.js보다 먼저 로드) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 2. 주문서 및 주문 내역 로직 스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
